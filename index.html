<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <!--
    ========================================
    ▼▼▼ ダウンロード設定 ▼▼▼
    ========================================
  -->

  <script>

    const owner = "887487";
    const repo = "_";
    const branch = "main";

    // ダウンロード対象フォルダー
    const targetFolder = "Ver4（作成中）";

  </script>

  <!--
    ========================================
    ▲▲▲ ダウンロード設定ここまで ▲▲▲
    ========================================
  -->


  <!-- 拡大・縮小禁止 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >


  <title>887487_Downloader</title>


  <!-- JSZip -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  </script>


  <style>

    /* ========================================
       基本設定
       ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Meiryo,
        sans-serif;

      background: #f3f4f6;

      color: #222;

      display: flex;

      justify-content: center;
      align-items: center;

      min-height: 100vh;

      padding: 20px;

    }


    /* ========================================
       メインコンテナ
       ======================================== */

    .container {

      width: 100%;

      max-width: 500px;

      background: #ffffff;

      border-radius: 16px;

      padding: 30px 25px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);

      text-align: center;

    }


    /* ========================================
       タイトル
       ======================================== */

    h1 {

      margin: 0 0 10px;

      font-size: 24px;

      line-height: 1.4;

      word-break: break-word;

    }


    /* ========================================
       対象フォルダー表示
       ======================================== */

    .target-folder {

      margin: 0 0 25px;

      padding: 12px 15px;

      background: #f5f6f8;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-all;

    }


    .target-folder span {

      font-weight: bold;

    }


    /* ========================================
       ボタン共通
       ======================================== */

    button {

      width: 100%;

      min-height: 54px;

      border: none;

      border-radius: 10px;

      color: #ffffff;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.1s,
        opacity 0.2s;

      margin-bottom: 12px;

      -webkit-tap-highlight-color: transparent;

    }


    button:active {

      transform: scale(0.98);

    }


    button:disabled {

      background: #9ca3af !important;

      cursor: not-allowed;

      transform: none;

    }


    /* ========================================
       ダウンロードボタン
       ======================================== */

    #downloadButton {

      background: #2563eb;

    }


    #downloadButton:hover {

      background: #1d4ed8;

    }


    /* ========================================
       ページ更新ボタン
       ======================================== */

    #reloadButton {

      background: #6b7280;

    }


    #reloadButton:hover {

      background: #4b5563;

    }


    /* ========================================
       ステータス
       ======================================== */

    #status {

      margin: 8px 0 0;

      min-height: 24px;

      font-size: 14px;

      line-height: 1.6;

      color: #555;

      word-break: break-all;

    }


    /* ========================================
       プログレスバー
       ======================================== */

    .progress {

      display: none;

      margin-top: 10px;

      width: 100%;

      height: 8px;

      background: #e5e7eb;

      border-radius: 999px;

      overflow: hidden;

    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background: #2563eb;

      transition: width 0.2s;

    }


    /* ========================================
       スマートフォン
       ======================================== */

    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .container {

        padding: 25px 18px;

        border-radius: 14px;

      }


      h1 {

        font-size: 21px;

      }


      .target-folder {

        font-size: 13px;

        margin-bottom: 20px;

      }


      button {

        min-height: 56px;

        font-size: 16px;

      }


      #status {

        font-size: 13px;

      }

    }


    /* ========================================
       小型スマートフォン
       ======================================== */

    @media (max-width: 380px) {

      body {

        padding: 10px;

      }


      .container {

        padding: 20px 15px;

      }


      h1 {

        font-size: 19px;

      }


      button {

        min-height: 52px;

      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       メイン
       ======================================== -->

  <main class="container">


    <!-- タイトル -->

    <h1>
      887487 Downloader
    </h1>


    <!-- 対象フォルダー -->

    <div class="target-folder">

      対象フォルダー：

      <span id="targetFolderName"></span>

    </div>


    <!-- ========================================
         ダウンロードボタン
         ======================================== -->

    <button
      id="downloadButton"
      onclick="downloadZip()">

      ダウンロード

    </button>


    <!-- ========================================
         ページ更新ボタン
         ======================================== -->

    <button
      id="reloadButton"
      onclick="reloadPage()">

      ページを更新

    </button>


    <!-- ========================================
         プログレスバー
         ======================================== -->

    <div
      class="progress"
      id="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>


    <!-- ========================================
         ステータス
         ======================================== -->

    <p id="status"></p>


  </main>



  <script>


    /* ========================================
       初期表示
       ======================================== */

    document
      .getElementById("targetFolderName")
      .innerText = targetFolder;



    /* ========================================
       ページ更新
       ======================================== */

    function reloadPage() {

      location.reload();

    }



    /* ========================================
       GitHub Contents API
       ======================================== */

    async function fetchContents(path) {


      const url =
        `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${branch}`;


      const res =
        await fetch(url);


      if (!res.ok) {

        throw new Error(
          `GitHub API Error: ${res.status} ${res.statusText}`
        );

      }


      return await res.json();

    }



    /* ========================================
       ZIPへファイルを追加
       ======================================== */

    async function addToZip(
      zip,
      folderPath,
      zipFolder
    ) {


      const items =
        await fetchContents(folderPath);


      for (const item of items) {


        /* ------------------------------------
           ファイル
           ------------------------------------ */

        if (item.type === "file") {


          const fileRes =
            await fetch(item.download_url);


          if (!fileRes.ok) {

            throw new Error(
              `ファイル取得失敗: ${item.path}`
            );

          }


          const blob =
            await fileRes.blob();


          zipFolder.file(
            item.name,
            blob
          );


          document
            .getElementById("status")
            .innerText =
              `取得中：${item.path}`;

        }



        /* ------------------------------------
           フォルダー
           ------------------------------------ */

        if (item.type === "dir") {


          const newFolder =
            zipFolder.folder(item.name);


          await addToZip(
            zip,
            item.path,
            newFolder
          );

        }

      }

    }



    /* ========================================
       ZIPダウンロード
       ======================================== */

    async function downloadZip() {


      const downloadButton =
        document.getElementById(
          "downloadButton"
        );


      const reloadButton =
        document.getElementById(
          "reloadButton"
        );


      const status =
        document.getElementById(
          "status"
        );


      const progress =
        document.getElementById(
          "progress"
        );


      const progressBar =
        document.getElementById(
          "progressBar"
        );



      try {


        /* ------------------------------------
           ボタン無効化
           ------------------------------------ */

        downloadButton.disabled = true;

        reloadButton.disabled = true;


        downloadButton.innerText =
          "ダウンロード中...";



        /* ------------------------------------
           プログレス表示
           ------------------------------------ */

        progress.style.display =
          "block";


        progressBar.style.width =
          "10%";


        status.innerText =
          "取得開始...";



        /* ------------------------------------
           ZIP作成
           ------------------------------------ */

        const zip =
          new JSZip();



        await addToZip(
          zip,
          targetFolder,
          zip
        );



        /* ------------------------------------
           ZIP生成開始
           ------------------------------------ */

        progressBar.style.width =
          "80%";


        status.innerText =
          "ZIPファイル生成中...";



        const content =
          await zip.generateAsync(

            {
              type: "blob"
            },


            function(metadata) {


              const percent =
                Math.round(
                  metadata.percent
                );


              const displayPercent =
                80 + (percent * 0.2);


              progressBar.style.width =
                `${displayPercent}%`;


              status.innerText =
                `ZIP生成中：${percent}%`;

            }

          );



        progressBar.style.width =
          "100%";



        /* ------------------------------------
           ZIPファイル名
           ターゲットフォルダー名を使用
           ------------------------------------ */

        const zipFileName =
          `${targetFolder}.zip`;



        /* ------------------------------------
           ダウンロード
           ------------------------------------ */

        const url =
          URL.createObjectURL(
            content
          );


        const a =
          document.createElement(
            "a"
          );


        a.href = url;


        a.download =
          zipFileName;


        document.body.appendChild(a);


        a.click();


        document.body.removeChild(a);



        /* ------------------------------------
           URL解放
           ------------------------------------ */

        setTimeout(
          () => {

            URL.revokeObjectURL(url);

          },
          1000
        );



        /* ------------------------------------
           完了
           ------------------------------------ */

        status.innerText =
          `完了！「${zipFileName}」をダウンロードしました。`;


        downloadButton.innerText =
          "ダウンロード完了";


      }


      /* ======================================
         エラー処理
         ====================================== */

      catch (error) {


        console.error(error);


        status.innerText =
          `エラー：${error.message}`;


        progressBar.style.width =
          "0%";


        downloadButton.innerText =
          "再試行";


      }


      /* ======================================
         ボタン復帰
         ====================================== */

      finally {


        downloadButton.disabled =
          false;


        reloadButton.disabled =
          false;

      }

    }

  </script>


</body>

</html>
