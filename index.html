<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <!-- ========================================
       ▼▼▼ ダウンロード設定 ▼▼▼
       ======================================== -->

  <script>

    const owner = "887487";
    const repo = "-";
    const branch = "main";

    // ダウンロード対象フォルダー
    const targetFolder = "Ver4（作成中）";

  </script>

  <!-- ========================================
       ▲▲▲ ダウンロード設定ここまで ▲▲▲
       ======================================== -->


  <!-- 拡大・縮小禁止 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
  >


  <title>887487_Downloader</title>


  <!-- JSZip -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  </script>


  <style>

    /* ========================================
       基本設定
       ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      /* スクロール禁止 */
      overflow: hidden;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Meiryo,
        sans-serif;

      background: #f3f4f6;

      color: #222;

      display: flex;

      justify-content: center;
      align-items: center;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding: 20px;

      /* スクロール禁止 */
      overflow: hidden;

      /* タッチ操作 */
      touch-action: manipulation;

    }


    /* ========================================
       メインコンテナ
       ======================================== */

    .container {

      width: 100%;

      max-width: 500px;

      max-height:
        calc(100dvh - 40px);

      background: #ffffff;

      border-radius: 16px;

      padding: 30px 25px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);

      text-align: center;

      overflow: hidden;

    }


    /* ========================================
       タイトル
       ======================================== */

    h1 {

      margin: 0 0 10px;

      font-size: 24px;

      line-height: 1.4;

      word-break: break-word;

    }


    /* ========================================
       対象フォルダー
       ======================================== */

    .target-folder {

      margin: 0 0 25px;

      padding: 12px 15px;

      background: #f5f6f8;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.5;

      overflow-wrap: anywhere;

      word-break: break-word;

    }


    .target-folder span {

      font-weight: bold;

    }


    /* ========================================
       ボタン共通
       ======================================== */

    button {

      position: relative;

      width: 100%;

      min-height: 54px;

      border: none;

      border-radius: 10px;

      color: #ffffff;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-bottom: 12px;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      /*
       * アニメーション
       */
      transition:
        background-color 0.15s ease,
        transform 0.08s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;

    }


    /* ========================================
       ボタン押下時
       ======================================== */

    button:active {

      transform:
        scale(0.96);

    }


    /* ========================================
       ダウンロードボタン
       ======================================== */

    #downloadButton {

      background: #2563eb;

      box-shadow:
        0 4px 0 #1d4ed8;

    }


    #downloadButton:hover {

      background: #1d4ed8;

    }


    #downloadButton:active {

      background: #1e40af;

      box-shadow:
        0 1px 0 #1e3a8a;

      transform:
        translateY(3px)
        scale(0.97);

    }


    /* ========================================
       ダウンロード処理中
       ======================================== */

    #downloadButton.processing {

      background: #64748b;

      box-shadow:
        0 4px 0 #475569;

      cursor: wait;

    }


    /* ========================================
       ダウンロード完了
       ======================================== */

    #downloadButton.completed {

      background: #16a34a;

      box-shadow:
        0 4px 0 #15803d;

    }


    /* ========================================
       エラー
       ======================================== */

    #downloadButton.error {

      background: #dc2626;

      box-shadow:
        0 4px 0 #b91c1c;

    }


    /* ========================================
       ページ更新ボタン
       ======================================== */

    #reloadButton {

      background: #6b7280;

      box-shadow:
        0 4px 0 #4b5563;

    }


    #reloadButton:hover {

      background: #4b5563;

    }


    #reloadButton:active {

      background: #374151;

      box-shadow:
        0 1px 0 #1f2937;

      transform:
        translateY(3px)
        scale(0.97);

    }


    /* ========================================
       更新処理中
       ======================================== */

    #reloadButton.processing {

      background: #475569;

      box-shadow:
        0 4px 0 #334155;

      cursor: wait;

    }


    /* ========================================
       無効化
       ======================================== */

    button:disabled {

      cursor: not-allowed;

    }


    /*
     * 処理中はダウンロードボタンを
     * 明確に表示
     */

    #downloadButton.processing:disabled {

      opacity: 1;

    }


    /* ========================================
       ステータス
       ======================================== */

    #status {

      margin: 8px 0 0;

      min-height: 24px;

      font-size: 14px;

      line-height: 1.6;

      color: #555;

      overflow-wrap: anywhere;

      word-break: break-word;

    }


    /* ========================================
       プログレスバー
       ======================================== */

    .progress {

      display: none;

      margin-top: 10px;

      width: 100%;

      height: 10px;

      background: #e5e7eb;

      border-radius: 999px;

      overflow: hidden;

    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background: #2563eb;

      border-radius: 999px;

      transition:
        width 0.2s ease;

    }


    /* ========================================
       スマートフォン
       ======================================== */

    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .container {

        padding: 25px 18px;

        border-radius: 14px;

        max-height:
          calc(100dvh - 30px);

      }


      h1 {

        font-size: 21px;

      }


      .target-folder {

        font-size: 13px;

        margin-bottom: 20px;

      }


      button {

        min-height: 56px;

        font-size: 16px;

      }


      #status {

        font-size: 13px;

      }

    }


    /* ========================================
       小型スマートフォン
       ======================================== */

    @media (max-width: 380px) {

      body {

        padding: 10px;

      }


      .container {

        padding: 20px 15px;

        max-height:
          calc(100dvh - 20px);

      }


      h1 {

        font-size: 19px;

        margin-bottom: 8px;

      }


      .target-folder {

        margin-bottom: 15px;

        padding: 10px 12px;

      }


      button {

        min-height: 52px;

        margin-bottom: 10px;

      }


      #status {

        font-size: 12px;

      }


      .progress {

        height: 8px;

      }

    }


    /* ========================================
       高さが小さいスマートフォン
       ======================================== */

    @media (max-height: 600px) {

      .container {

        padding-top: 18px;

        padding-bottom: 18px;

      }


      h1 {

        font-size: 20px;

        margin-bottom: 6px;

      }


      .target-folder {

        padding: 8px 12px;

        margin-bottom: 12px;

      }


      button {

        min-height: 46px;

        margin-bottom: 8px;

      }


      #status {

        margin-top: 4px;

        min-height: 20px;

        font-size: 12px;

      }


      .progress {

        margin-top: 6px;

      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       メイン
       ======================================== -->

  <main class="container">


    <!-- タイトル -->

    <h1>
      887487 Downloader
    </h1>


    <!-- 対象フォルダー -->

    <div class="target-folder">

      対象フォルダー：

      <span id="targetFolderName"></span>

    </div>


    <!-- ========================================
         ダウンロードボタン
         ======================================== -->

    <button
      id="downloadButton"
      onclick="downloadZip()">

      ダウンロード

    </button>


    <!-- ========================================
         ページ更新ボタン
         ======================================== -->

    <button
      id="reloadButton"
      onclick="reloadPage()">

      ページを更新

    </button>


    <!-- ========================================
         プログレスバー
         ======================================== -->

    <div
      class="progress"
      id="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>


    <!-- ========================================
         ステータス
         ======================================== -->

    <p id="status"></p>


  </main>



  <script>


    /* ========================================
       初期表示
       ======================================== */

    document
      .getElementById("targetFolderName")
      .innerText =
        targetFolder;



    /* ========================================
       ページ更新
       ======================================== */

    function reloadPage() {

      const button =
        document.getElementById(
          "reloadButton"
        );


      /*
       * 押された瞬間に表示変更
       */

      button.classList.add(
        "processing"
      );


      button.disabled = true;


      button.innerText =
        "● 更新中…";


      /*
       * 少しだけ表示を見せてから
       * ページを更新
       */

      setTimeout(() => {

        location.reload();

      }, 150);

    }



    /* ========================================
       GitHub Contents API
       ======================================== */

    async function fetchContents(path) {


      const url =
        `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${branch}`;


      const res =
        await fetch(url);


      if (!res.ok) {

        throw new Error(
          `GitHub API Error: ${res.status} ${res.statusText}`
        );

      }


      return await res.json();

    }



    /* ========================================
       ZIPへファイルを追加
       ======================================== */

    async function addToZip(
      zip,
      folderPath,
      zipFolder
    ) {


      const items =
        await fetchContents(
          folderPath
        );


      for (const item of items) {


        /* ------------------------------------
           ファイル
           ------------------------------------ */

        if (item.type === "file") {


          const fileRes =
            await fetch(
              item.download_url
            );


          if (!fileRes.ok) {

            throw new Error(
              `ファイル取得失敗: ${item.path}`
            );

          }


          const blob =
            await fileRes.blob();


          zipFolder.file(
            item.name,
            blob
          );


          document
            .getElementById("status")
            .innerText =
              `取得中：${item.path}`;

        }



        /* ------------------------------------
           フォルダー
           ------------------------------------ */

        if (item.type === "dir") {


          const newFolder =
            zipFolder.folder(
              item.name
            );


          await addToZip(
            zip,
            item.path,
            newFolder
          );

        }

      }

    }



    /* ========================================
       ZIPダウンロード
       ======================================== */

    async function downloadZip() {


      const downloadButton =
        document.getElementById(
          "downloadButton"
        );


      const reloadButton =
        document.getElementById(
          "reloadButton"
        );


      const status =
        document.getElementById(
          "status"
        );


      const progress =
        document.getElementById(
          "progress"
        );


      const progressBar =
        document.getElementById(
          "progressBar"
        );


      try {


        /* ------------------------------------
           ★ 押された瞬間の表示
           ------------------------------------ */

        downloadButton.classList.remove(
          "completed",
          "error"
        );


        downloadButton.classList.add(
          "processing"
        );


        downloadButton.disabled =
          true;


        reloadButton.disabled =
          true;


        downloadButton.innerText =
          "● 処理中…";


        status.innerText =
          "ダウンロードを開始しています…";


        /*
         * すぐにプログレスバーを表示
         */

        progress.style.display =
          "block";


        progressBar.style.width =
          "5%";



        /* ------------------------------------
           ZIP作成
           ------------------------------------ */

        const zip =
          new JSZip();


        status.innerText =
          "GitHubからファイルを取得しています…";


        await addToZip(
          zip,
          targetFolder,
          zip
        );



        /* ------------------------------------
           ZIP生成
           ------------------------------------ */

        progressBar.style.width =
          "80%";


        status.innerText =
          "ZIPファイルを生成しています…";


        const content =
          await zip.generateAsync(

            {
              type: "blob"
            },


            function(metadata) {


              const percent =
                Math.round(
                  metadata.percent
                );


              const displayPercent =
                80 +
                (percent * 0.2);


              progressBar.style.width =
                `${displayPercent}%`;


              status.innerText =
                `ZIP生成中：${percent}%`;

            }

          );



        progressBar.style.width =
          "100%";



        /* ------------------------------------
           ZIPファイル名
           ------------------------------------ */

        const zipFileName =
          `${targetFolder}.zip`;



        /* ------------------------------------
           ダウンロード
           ------------------------------------ */

        const url =
          URL.createObjectURL(
            content
          );


        const a =
          document.createElement(
            "a"
          );


        a.href =
          url;


        a.download =
          zipFileName;


        document.body.appendChild(
          a
        );


        a.click();


        document.body.removeChild(
          a
        );



        /* ------------------------------------
           URL解放
           ------------------------------------ */

        setTimeout(
          () => {

            URL.revokeObjectURL(
              url
            );

          },
          1000
        );



        /* ------------------------------------
           ★ 完了表示
           ------------------------------------ */

        downloadButton.classList.remove(
          "processing"
        );


        downloadButton.classList.add(
          "completed"
        );


        downloadButton.innerText =
          "✓ ダウンロード完了";


        status.innerText =
          `「${zipFileName}」のダウンロードが完了しました。`;


      }


      /* ======================================
         エラー処理
         ====================================== */

      catch (error) {


        console.error(
          error
        );


        progressBar.style.width =
          "0%";


        downloadButton.classList.remove(
          "processing"
        );


        downloadButton.classList.add(
          "error"
        );


        downloadButton.innerText =
          "! 再試行";


        status.innerText =
          `エラー：${error.message}`;


      }


      /* ======================================
         ボタン復帰
         ====================================== */

      finally {


        downloadButton.disabled =
          false;


        reloadButton.disabled =
          false;

      }

    }

  </script>


</body>

</html>
