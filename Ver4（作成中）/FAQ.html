<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❓ FAQ</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" onerror="void(0)"></script>
  <script src="common-utils.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    /* header は position:fixed のため、本文をヘッダーの高さ分だけ下げる。
       これが無いと上部がヘッダーに隠れる。 */
    body {
      margin: 0;
      padding-top: var(--header-h);
      box-sizing: border-box;
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .faq-layout { flex: 1; display: flex; overflow: hidden; }

    /* 左：カテゴリ一覧 */
    .faq-side {
      width: 240px;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }
    .faq-side-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
    .faq-cat {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; font-size: 12px; cursor: pointer;
      border-bottom: 1px solid var(--border); color: var(--text);
    }
    .faq-cat:hover { background: var(--accent-lt); }
    .faq-cat.active { background: var(--accent-lt); color: var(--accent-text); font-weight: 700; }
    .faq-cat-count { margin-left: auto; font-size: 10px; color: var(--text3); }

    /* 右：本文 */
    .faq-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .faq-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .faq-bar-title { font-size: 14px; font-weight: 700; }
    .faq-bar-count { font-size: 11px; color: var(--text3); }
    .faq-scroll { flex: 1; overflow-y: auto; padding: 16px 18px 40px; }
    .faq-inner { max-width: 900px; margin: 0 auto; }

    /* 1件ぶんのカード（クリックで回答を開閉） */
    .faq-item {
      border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 10px; background: var(--surface); overflow: hidden;
    }
    .faq-q {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
      line-height: 1.7; color: var(--text);
    }
    .faq-q:hover { background: var(--accent-lt); }
    .faq-q-mark { color: var(--accent-text); flex-shrink: 0; font-size: 14px; }
    .faq-q-text { flex: 1; min-width: 0; }
    .faq-q-arrow { flex-shrink: 0; color: var(--text3); font-size: 11px; transition: transform .15s; }
    .faq-item.open .faq-q-arrow { transform: rotate(90deg); }

    .faq-a { display: none; padding: 0 14px 14px 38px; }
    .faq-item.open .faq-a { display: block; }
    .faq-a-text {
      font-size: 13px; line-height: 1.9; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
    }
    .faq-note {
      margin-top: 9px; padding: 7px 10px; font-size: 11px; line-height: 1.7;
      color: var(--text2); background: var(--surface2);
      border-left: 3px solid var(--border); border-radius: 4px;
      white-space: pre-wrap;
    }
    .faq-meta { margin-top: 8px; font-size: 10px; color: var(--text3); }
    .faq-hit { background: var(--mark-bg, #fff3a3); border-radius: 2px; }

    /* 回答内の画像 */
    .faq-fig { margin: 10px 0; }
    .faq-fig img {
      max-width: 100%; height: auto; display: block;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface2); cursor: zoom-in;
    }
    .faq-fig figcaption {
      margin-top: 5px; font-size: 11px; color: var(--text3);
    }
    /* 画像の拡大表示 */
    .faq-zoom {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.78); align-items: center; justify-content: center;
      padding: 24px; cursor: zoom-out;
    }
    .faq-zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .faq-empty {
      padding: 60px 0; text-align: center;
      color: var(--text3); font-size: 13px; line-height: 2;
    }

    @media (max-width: 760px) {
      .faq-side { display: none; }
      #searchBox { width: 180px; }
    }
  </style>
</head>
<body>

<header>
  <div class="hd-left">
    <button id="menuBtn" onclick="toggleSideMenu()">☰</button>
    <button class="header-title hd-title-btn" onclick="goHomePage()" title="ホームへ戻る">❓ FAQ</button>
  </div>
  <div class="hd-center"></div>
  <div class="hd-right">
    <button class="nav-btn" onclick="openNamedTab('script.html','scriptTab')">📋 スクリプト</button>
    <button class="nav-btn" onclick="openNamedTab('mail.html','mailTab')">✉️ メール</button>
    <button class="nav-btn" onclick="openNamedTab('screen.html','screenFlowTab')">🖥️ 画面遷移</button>
    <!-- 他ページ（スクリプト／メール／画面遷移）と同じ位置・同じ仕様の検索欄 -->
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="FAQ 検索（質問・回答・備考）" autocomplete="off"
             oninput="faqSearch(this.value)"
             onkeydown="if(event.key==='Escape'){this.value='';faqSearch('');}">
      <button id="clearBtn" onclick="faqClearSearch()">×</button>
    </div>
  </div>
</header>

<aside id="sideMenu"></aside>

<div class="faq-layout">
  <aside class="faq-side">
    <div class="sidebar-top"><span class="sidebar-top-label">カテゴリ</span></div>
    <div class="faq-side-scroll" id="faqCats"></div>
    <button class="add-cat-btn" onclick="faqToggleAll()" id="faqToggleBtn"
            title="すべての回答を開く / 閉じる">全て開く</button>
  </aside>

  <main class="faq-main">
    <div class="faq-bar">
      <span class="faq-bar-title" id="faqTitle">すべて</span>
      <span class="faq-bar-count" id="faqCount"></span>
    </div>
    <div class="faq-scroll">
      <div class="faq-inner" id="faqList"></div>
    </div>
  </main>
</div>

<!-- 画像の拡大表示 -->
<div class="faq-zoom" id="faqZoom" onclick="faqZoomClose()">
  <img id="faqZoomImg" alt="">
</div>

<script>
  // FAQ データは data.js（APP_STATIC_DATA.faqData）が正。
  // 形式: [{ id, category, question, answer, note }]
  var _faqCat  = '';      // 選択中のカテゴリ（空＝すべて）
  var _faqOpen = {};      // 開いている項目
  var _faqAllOpen = false;

  function faqData() {
    var c = (window._appCache && window._appCache.faqData) || null;
    if (c && c.length) return c;
    var sd = window.APP_STATIC_DATA;
    return (sd && Array.isArray(sd.faqData)) ? sd.faqData : [];
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /**
   * onclick 属性に文字列を埋め込むためのエスケープ。
   * JSON.stringify だと二重引用符が入って属性が途中で閉じてしまうので、
   * シングルクォートで包んだうえで中身を退避する。
   */
  function jsAttr(s) {
    return "'" + String(s == null ? '' : s)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;') + "'";
  }

  /**
   * 回答テキストを表示用の HTML にする。
   * 画像は次の書き方に対応する（1行に1つ書く）。
   *   ![説明](images/example.png)   … Markdown 風
   *   images/example.png            … 画像の拡張子で終わる行
   * 相対パスは日本語やスペースを含むと file:// で読めないためエンコードする。
   */
  var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|svg)$/i;

  function imgSrc(p) {
    var v = String(p || '').trim();
    if (!v) return '';
    if (/^(data:|https?:|file:)/i.test(v)) return v;
    if (/%[0-9a-f]{2}/i.test(v)) return v;
    try { return v.split('/').map(encodeURIComponent).join('/'); } catch (e) { return v; }
  }

  function renderAnswer(text, q) {
    var lines = String(text == null ? '' : text).split(/\r?\n/);
    var out = [], buf = [];

    var flush = function () {
      if (!buf.length) return;
      out.push('<div class="faq-a-text">' + mark(buf.join('\n'), q) + '</div>');
      buf = [];
    };

    lines.forEach(function (ln) {
      var t = ln.trim();
      var m = /^!\[([^\]]*)\]\(([^)]+)\)$/.exec(t);          // ![説明](パス)
      var path = m ? m[2].trim() : (IMG_RE.test(t) ? t : null);
      if (!path) { buf.push(ln); return; }

      flush();
      var alt = m ? m[1] : '';
      out.push('<figure class="faq-fig">'
        + '<img src="' + esc(imgSrc(path)) + '" alt="' + esc(alt) + '" loading="lazy"'
        + ' onclick="faqZoom(this.src)" title="クリックで拡大">'
        + (alt ? '<figcaption>' + esc(alt) + '</figcaption>' : '')
        + '</figure>');
    });
    flush();
    return out.join('');
  }

  /** 画像を全画面で拡大表示する */
  function faqZoom(src) {
    var ov = document.getElementById('faqZoom');
    var im = document.getElementById('faqZoomImg');
    if (!ov || !im) return;
    im.src = src;
    ov.style.display = 'flex';
  }
  function faqZoomClose() {
    var ov = document.getElementById('faqZoom');
    if (ov) ov.style.display = 'none';
  }

  /** 検索語をハイライトする（エスケープ後の文字列に対して行う） */
  function mark(text, q) {
    var t = esc(text);
    if (!q) return t;
    try {
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return t.replace(re, '<span class="faq-hit">$1</span>');
    } catch (e) { return t; }
  }

  function renderCats() {
    var el = document.getElementById('faqCats');
    if (!el) return;
    var all = faqData(), cnt = {};
    all.forEach(function (f) {
      var c = f.category || '未分類';
      cnt[c] = (cnt[c] || 0) + 1;
    });
    var names = Object.keys(cnt).sort(function (a, b) {
      return a.localeCompare(b, 'ja', { numeric: true });
    });
    var row = function (key, label, n) {
      return '<div class="faq-cat' + (_faqCat === key ? ' active' : '') + '"'
        + ' onclick="selectCat(' + jsAttr(key) + ')">'
        + '<span>' + esc(label) + '</span>'
        + '<span class="faq-cat-count">' + n + '</span></div>';
    };
    el.innerHTML = row('', 'すべて', all.length)
      + names.map(function (n) { return row(n, n, cnt[n]); }).join('');
  }

  function selectCat(c) {
    _faqCat = c || '';
    renderCats(); renderList();
  }

  function renderList() {
    var el = document.getElementById('faqList');
    if (!el) return;
    var q = ((document.getElementById('searchBox') || {}).value || '').trim().toLowerCase();

    var list = faqData().filter(function (f) {
      if (_faqCat && (f.category || '未分類') !== _faqCat) return false;
      if (!q) return true;
      return (String(f.question || '') + String(f.answer || '') + String(f.note || ''))
               .toLowerCase().indexOf(q) >= 0;
    });

    document.getElementById('faqTitle').textContent = _faqCat || 'すべて';
    document.getElementById('faqCount').textContent = list.length + ' 件';

    if (!list.length) {
      el.innerHTML = '<div class="faq-empty">'
        + (faqData().length === 0
            ? 'FAQ がまだ登録されていません。<br>管理画面の「❓ FAQ」タブから登録してください。'
            : '該当する項目がありません。')
        + '</div>';
      return;
    }

    el.innerHTML = list.map(function (f) {
      // 検索中は探しやすいよう自動で開く
      var open = _faqAllOpen || !!_faqOpen[f.id] || !!q;
      return '<div class="faq-item' + (open ? ' open' : '') + '" id="faq_' + esc(f.id) + '">'
        + '<div class="faq-q" onclick="toggleItem(' + jsAttr(f.id) + ')">'
        +   '<span class="faq-q-mark">Q</span>'
        +   '<span class="faq-q-text">' + mark(f.question, q) + '</span>'
        +   '<span class="faq-q-arrow">▶</span>'
        + '</div>'
        + '<div class="faq-a">'
        +   renderAnswer(f.answer, q)
        +   (f.note ? '<div class="faq-note">' + mark(f.note, q) + '</div>' : '')
        +   '<div class="faq-meta">ID ' + esc(f.id) + '　/　' + esc(f.category || '未分類') + '</div>'
        + '</div></div>';
    }).join('');
  }

  /** 検索の実行。他ページと同じく × ボタンの出し分けも行う */
  function faqSearch(v) {
    var btn = document.getElementById('clearBtn');
    if (btn) btn.style.display = (v && v.length) ? '' : 'none';
    renderList();
  }

  function faqClearSearch() {
    var el = document.getElementById('searchBox');
    if (el) { el.value = ''; el.focus(); }
    faqSearch('');
  }

  function toggleItem(id) {
    _faqOpen[id] = !_faqOpen[id];
    var el = document.getElementById('faq_' + id);
    if (el) el.classList.toggle('open', _faqOpen[id]);
  }

  function faqToggleAll() {
    _faqAllOpen = !_faqAllOpen;
    _faqOpen = {};
    document.getElementById('faqToggleBtn').textContent = _faqAllOpen ? '全て閉じる' : '全て開く';
    renderList();
  }

  document.addEventListener('DOMContentLoaded', function () {
    var start = function () {
      renderCats(); renderList();
      var btn = document.getElementById('clearBtn');
      if (btn) btn.style.display = 'none';   // 初期は非表示（他ページと同じ）
    };
    // IndexedDB 側に新しいデータがあれば読み込んでから描画する
    (window.initAppData ? window.initAppData() : Promise.resolve()).then(start).catch(start);
  });
</script>
</body>
</html>
